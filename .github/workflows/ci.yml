name: ch-mirror

# Same shape as Companies House's *-terraform repos: checks on every PR, a
# Terraform plan posted for review, and nothing deployed without a human
# approving the kronos-prod environment.
# Security model for the self-hosted runner (Magnus, on the lab LAN, holds the Proxmox token):
# - This repo is public. Pull requests from forks never reach the self-hosted runner: every job
#   below only runs for pushes, manual runs, or PRs whose branch lives in this repo. Fork PRs get
#   the GitHub-hosted checks only (hosted-checks.yml).
# - Credentials stay on the runner host (~/.config/ch-mirror/pve-token, read by terraform/tf.sh
#   into the environment only). Nothing secret is stored in GitHub.
# - The saved plan contains input values, so it is never uploaded as an artifact (public repo):
#   it is kept on the runner host, outside the workspace, and only that exact plan is applied.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:   # image builds (monthly + on demand) live in image-rebuild.yml

env:
  # Docker Desktop's credential helper and the Python 3.13 tool venvs (what-broke #5, #6)
  PATH: /Applications/Docker.app/Contents/Resources/bin:/Users/graham/.local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin

jobs:
  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, mac-studio]
    steps:
      - uses: actions/checkout@v4
      - name: pre-commit (fmt, validate, docs, tflint, trivy, ansible-lint, policy tests)
        run: pre-commit run --all-files --show-diff-on-failure 2>&1 | tee "$RUNNER_TEMP/02-precommit.log"
      - name: Molecule (role logic; SSH/firewall/SELinux proved on a real VM by the Packer gate)
        working-directory: ansible
        run: molecule test 2>&1 | tee "$RUNNER_TEMP/04-molecule.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-evidence
          path: ${{ runner.temp }}/*.log

  plan:
    needs: checks
    runs-on: [self-hosted, mac-studio]
    outputs:
      changes: ${{ steps.changes.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - name: terraform plan
        shell: bash
        run: terraform/tf.sh plan -no-color 2>&1 | tee "$RUNNER_TEMP/05-plan.log"
      - name: policy check (conftest - a deny fails the job before anyone can approve apply)
        shell: bash   # -eo pipefail, so a deny is not hidden by tee
        run: scripts/policy-check.sh terraform 2>&1 | tee "$RUNNER_TEMP/08-policy.log"
      - name: Does the plan change anything?
        id: changes
        shell: bash
        # Only "Plan: N to add/change/destroy" means work; "No changes." means nothing to approve.
        run: |
          if grep -q '^No changes\.' "$RUNNER_TEMP/05-plan.log"; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "No infrastructure changes - apply (and its approval request) will be skipped."
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Keep the reviewed plan on the runner host (never uploaded)
        shell: bash
        run: |
          if [ "${{ steps.changes.outputs.changes }}" = "true" ]; then
            install -d -m 700 "$HOME/ch-mirror-state/plans"
            mv terraform/tfplan "$HOME/ch-mirror-state/plans/${{ github.run_id }}.tfplan"
          else
            rm -f terraform/tfplan
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plan-evidence
          path: |
            ${{ runner.temp }}/05-plan.log
            ${{ runner.temp }}/08-policy.log

  apply:
    # Skipped when the plan has no changes, so the owner is only asked to approve real changes.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.plan.outputs.changes == 'true'
    needs: plan
    runs-on: [self-hosted, mac-studio]
    environment: kronos-prod          # required reviewer = Graham (manual approval gate)
    steps:
      - uses: actions/checkout@v4
      - name: terraform apply (the reviewed plan from this run, nothing else)
        shell: bash
        run: |
          plan="$HOME/ch-mirror-state/plans/${{ github.run_id }}.tfplan"
          mv "$plan" terraform/tfplan
          terraform/tf.sh apply 2>&1 | tee "$RUNNER_TEMP/05-apply.log"
          rm -f terraform/tfplan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apply-evidence
          path: ${{ runner.temp }}/05-apply.log
