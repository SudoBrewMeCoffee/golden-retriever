name: ch-mirror

# Same shape as Companies House's *-terraform repos: checks on every PR, a
# Terraform plan posted for review, and nothing deployed without a human
# approving the kronos-prod environment.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_version:
        description: "Build a new hardened image (semver, e.g. 1.0.1). Leave empty to skip."
        required: false

env:
  # Docker Desktop's credential helper and the Python 3.13 tool venvs (what-broke #5, #6)
  PATH: /Applications/Docker.app/Contents/Resources/bin:/Users/graham/.local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin

jobs:
  checks:
    runs-on: [self-hosted, mac-studio]
    steps:
      - uses: actions/checkout@v4
      - name: pre-commit (fmt, validate, docs, tflint, trivy, ansible-lint)
        run: pre-commit run --all-files --show-diff-on-failure 2>&1 | tee "$RUNNER_TEMP/02-precommit.log"
      - name: Molecule (role logic; SSH/firewall/SELinux proved on a real VM by the Packer gate)
        working-directory: ansible
        run: molecule test 2>&1 | tee "$RUNNER_TEMP/04-molecule.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-evidence
          path: ${{ runner.temp }}/*.log

  image:
    if: github.event_name == 'workflow_dispatch' && inputs.image_version != ''
    needs: checks
    runs-on: [self-hosted, mac-studio]
    environment: kronos-prod          # building a new image also needs Graham's approval
    env:
      PKR_VAR_proxmox_username: ${{ secrets.PROXMOX_TOKEN_ID }}
      PKR_VAR_proxmox_token: ${{ secrets.PROXMOX_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned role + collections
        working-directory: ansible
        run: ansible-galaxy install -r requirements.yml -p roles && ansible-galaxy collection install -r requirements.yml
      - name: Packer build (hardening + real-VM verify gate)
        working-directory: packer
        run: |
          packer init .
          packer build -color=false -var-file=example.pkrvars.hcl -var version=${{ inputs.image_version }} . 2>&1 | tee "$RUNNER_TEMP/03-packer-build.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-evidence
          path: ${{ runner.temp }}/*.log

  plan:
    needs: checks
    runs-on: [self-hosted, mac-studio]
    env:
      TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
      TF_VAR_ssh_public_key: ${{ secrets.ADMIN_SSH_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
      - name: terraform plan
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -out=tfplan | tee "$RUNNER_TEMP/05-plan.log"
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            terraform/tfplan
            ${{ runner.temp }}/05-plan.log

  apply:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: plan
    runs-on: [self-hosted, mac-studio]
    environment: kronos-prod          # required reviewer = Graham (manual approval gate)
    env:
      TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
      TF_VAR_ssh_public_key: ${{ secrets.ADMIN_SSH_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform
      - name: terraform apply (the reviewed plan, nothing else)
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform apply -input=false -no-color tfplan | tee "$RUNNER_TEMP/05-apply.log"
