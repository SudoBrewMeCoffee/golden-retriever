name: Hosted checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hosted-checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Also applies to the terraform_validate pre-commit hook's init command.
  TF_CLI_ARGS_init: -backend=false -input=false
  TF_IN_AUTOMATION: "true"
  CHECKPOINT_DISABLE: "1"

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .pre-commit-config.yaml
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py313-${{ hashFiles('.pre-commit-config.yaml') }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24.9"
          cache: false
      - name: Install Terraform Docs
        run: go install github.com/terraform-docs/terraform-docs@v0.20.0
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.59.1
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.76.0
          cache: true
      - name: Install Python tools and Ansible dependencies
        run: |
          python -m pip install 'pre-commit==4.3.0' 'ansible-core>=2.19,<2.22'
          ansible-galaxy role install -r ansible/requirements.yml -p ansible/roles
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Run every configured hook on Python 3.13
        run: |
          # The ansible-lint manifest explicitly requests 3.14, overriding the
          # repository default. Preserve every hook, overriding only its runtime.
          python - <<'PYCONFIG'
          import os
          from pathlib import Path
          import yaml
          config = yaml.safe_load(Path(".pre-commit-config.yaml").read_text())
          for repo in config["repos"]:
              for hook in repo["hooks"]:
                  if hook["id"] == "ansible-lint":
                      hook["language_version"] = "python3.13"
          destination = Path(os.environ["RUNNER_TEMP"]) / "pre-commit-config.yaml"
          destination.write_text(yaml.safe_dump(config, sort_keys=False))
          PYCONFIG
          pre-commit run --config "$RUNNER_TEMP/pre-commit-config.yaml" --all-files --show-diff-on-failure

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ansible/requirements.yml
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Check Terraform
        working-directory: terraform
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
      - uses: hashicorp/setup-packer@1aa358be5cf73883762b302a3a03abd66e75b232 # v3.1.0
        with:
          version: "1.14.2"
      - name: Install Ansible and create a validation-only SSH key
        run: |
          python -m pip install 'ansible-core>=2.19,<2.22'
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/packer-validation"
      - name: Check Packer without building an image
        working-directory: packer
        run: |
          packer fmt -check .
          packer init .
          packer validate -var-file=example.pkrvars.hcl -var version=0.0.0 \
            -var "ssh_private_key_file=$RUNNER_TEMP/packer-validation" .

  molecule:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ansible/requirements.yml
      - name: Install Molecule and Ansible dependencies
        run: |
          python -m pip install 'ansible-core>=2.19,<2.22' 'molecule==26.10.0' 'molecule-plugins[docker]==26.10.12'
          ansible-galaxy role install -r ansible/requirements.yml -p ansible/roles
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Temporary Molecule runtime diagnostics
        working-directory: ansible
        run: |
          molecule create
          docker exec rocky9 sh -c 'id; ls -l /etc/shadow; getent shadow root | cut -d: -f1,3-9; sudo -n true; echo rc=$?; journalctl -b --no-pager | grep -i -E "pam|sudo|unix_chkpwd" | tail -20; cat /proc/1/comm'
          find "$HOME/.ansible/tmp" -path '*/molecule.*/inventory/*' -type f -print -exec cat {} \;
      - name: Test role in Docker using the scenario Dockerfile
        working-directory: ansible
        run: molecule test
