---
- name: Reference-style base image — CIS RHEL 9 Level 1 + Wazuh-ready
  hosts: all
  become: true
  vars:
    build_version: "dev"
  handlers:
    - name: Reload systemd units
      ansible.builtin.systemd:
        daemon_reload: true

  pre_tasks:
    # CIS 6.1.2 / Rocky v1 1.3.2 (issue #3): the role enables these units when
    # rhel9cis_aide_scan is 'timer' but does not create them, and EL9's aide
    # package ships none. Unit content follows the CIS RHEL 9 remediation.
    #
    # Issue #17 (image 1.0.2): the image ships no AIDE database. Each instance
    # builds its own baseline on first boot, after cloud-init has made its
    # per-instance changes (hostname, hosts, machine-id, network config).
    # Both units hang off cloud-init.target, not multi-user.target: on Rocky 9
    # cloud-final.service and cloud-init.target are ordered After=multi-user.target,
    # so "WantedBy=multi-user.target" plus "After=cloud-final.service" would be
    # an ordering cycle that systemd breaks by dropping a job.
    # The baseline also waits for kdump.service: it rebuilds the kdump initramfs
    # on first boot and is not ordered before multi-user.target, so without this
    # the baseline was taken mid-rebuild (found on the 1.0.2 test VM, what-broke #22).
    - name: Install AIDE check service unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/aidecheck.service
        content: |
          [Unit]
          Description=Aide Check
          After=aide-firstboot.service
          ConditionPathExists=/var/lib/aide/aide.db.gz

          [Service]
          Type=oneshot
          ExecStart=/usr/sbin/aide --check

          [Install]
          WantedBy=cloud-init.target
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd units

    - name: Install AIDE check timer unit (daily 05:00)
      ansible.builtin.copy:
        dest: /etc/systemd/system/aidecheck.timer
        content: |
          [Unit]
          Description=Aide check every day at 5AM

          [Timer]
          OnCalendar=*-*-* 05:00:00
          Unit=aidecheck.service

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd units

    - name: Install AIDE first-boot baseline unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/aide-firstboot.service
        content: |
          [Unit]
          Description=Create the per-instance AIDE baseline on first boot
          After=cloud-final.service kdump.service
          Wants=cloud-final.service
          ConditionPathExists=!/var/lib/aide/aide.db.gz

          [Service]
          Type=oneshot
          ExecStart=/usr/sbin/aide --init
          ExecStart=/usr/bin/mv -f /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz
          TimeoutStartSec=30min

          [Install]
          WantedBy=cloud-init.target
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd units
    # Handlers notified in pre_tasks run before the role starts.

  roles:
    - role: RHEL9-CIS
  post_tasks:
    - name: Stamp image version (traceability for auditors)
      ansible.builtin.copy:
        dest: /etc/ch-mirror-release
        content: "ch-rocky9-base {{ build_version }}\n"
        mode: "0644"

    # The Packer cleanup step deletes the build-time AIDE database, so this
    # unit runs exactly once, on each instance's first boot.
    - name: Enable AIDE first-boot baseline
      ansible.builtin.systemd:
        name: aide-firstboot.service
        enabled: true

    - name: Ensure auditd enabled (common CIS finding)
      ansible.builtin.service:
        name: auditd
        enabled: true
