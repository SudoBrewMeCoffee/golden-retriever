---
- name: Require enforcing SELinux before starting scheduled check
  ansible.builtin.command: getenforce
  register: aide_enforcement_before
  changed_when: false
  failed_when: aide_enforcement_before.stdout | trim != 'Enforcing'

- name: Read effective permissive domains before scheduled check
  ansible.builtin.command: semanage permissive -l
  register: aide_permissive_before
  changed_when: false

- name: Require enforcing AIDE domain before scheduled check
  ansible.builtin.assert:
    that: not (aide_permissive_before.stdout is regex('(?m)^\s*aide_t\s*$'))
    fail_msg: "aide_t is individually permissive despite global enforcement"

- name: Read previous scheduled AIDE invocation
  ansible.builtin.systemd_service:
    name: aidecheck.service
  register: aide_previous

- name: Require an idle service so verification starts a fresh invocation
  ansible.builtin.assert:
    that: aide_previous.status.ActiveState in ['inactive', 'failed']

- name: Hash existing baseline before scheduled check
  ansible.builtin.stat:
    path: /var/lib/aide/aide.db.gz
    checksum_algorithm: sha256
  register: aide_db_before

- name: Require an existing instance baseline
  ansible.builtin.assert:
    that: aide_db_before.stat.exists

- name: Run the actual service used by the daily timer
  # Capture the exit code even on failure, then inspect that invocation's journal.
  ansible.builtin.command: systemctl start aidecheck.service  # noqa command-instead-of-module
  register: aide_service_run
  changed_when: false
  failed_when: false

- name: Read this scheduled AIDE invocation
  ansible.builtin.systemd_service:
    name: aidecheck.service
  register: aidecheck

- name: Require a completed service invocation before reading its journal
  ansible.builtin.assert:
    that:
      - aide_service_run.rc == 0
      - aidecheck.status.ConditionResult == 'yes'
      - aidecheck.status.InvocationID is match('^[0-9a-f]{32}$')
      - aidecheck.status.InvocationID != aide_previous.status.InvocationID | default('')

- name: Read only the new scheduled AIDE invocation journal
  ansible.builtin.command:
    argv:
      - journalctl
      - "_SYSTEMD_INVOCATION_ID={{ aidecheck.status.InvocationID }}"
      - --no-pager
      - --output=cat
      - --quiet
  register: aide_service_log
  changed_when: false

- name: Read current SELinux enforcement after scheduled check
  ansible.builtin.command: getenforce
  register: aide_enforcement
  changed_when: false

- name: Read effective permissive domains after scheduled check
  ansible.builtin.command: semanage permissive -l
  register: aide_permissive_after
  changed_when: false

- name: Hash baseline after scheduled check
  ansible.builtin.stat:
    path: /var/lib/aide/aide.db.gz
    checksum_algorithm: sha256
  register: aide_db_after

- name: Assert scheduled AIDE acceptance evidence
  ansible.builtin.import_tasks: assert-aide-service.yml

- name: Read scheduled AIDE timer state
  ansible.builtin.systemd_service:
    name: aidecheck.timer
  register: aide_timer

- name: Daily AIDE timer remains enabled and active
  ansible.builtin.assert:
    that:
      - aide_timer.status.UnitFileState == 'enabled'
      - aide_timer.status.ActiveState == 'active'
