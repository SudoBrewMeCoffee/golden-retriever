# Guardrails for ansible-lockdown/RHEL9-CIS, verified against release 2.4.2
# (defaults/main/main.yml and the pre-flight asserts in tasks/main.yml).
# Intent: CIS Level 1 server profile, nothing that locks us out of a lab VM.
# Every deviation from the benchmark is listed in evidence/deviations.md.

rhel9cis_level_1: true
rhel9cis_level_2: false          # role default is true

# 5.3.x PAM / authselect (issue #2). In 1.0.0 this was false, which silently
# skipped the WHOLE PAM section (5.3.2.x authselect profile, faillock,
# pwquality, pwhistory, nullok) - every one of those tasks is gated on it.
# The role says "will be fine if clean new un-configured build", which is
# exactly what an image build is: a fresh cloud image, never a live server.
# Safety net: verify-vm.yml proves key login + sudo still work before the
# template is published.
rhel9cis_disruption_high: true

# Keep SELinux enforcing (CIS wants it on)
rhel9cis_selinux_disable: false

# No GRUB password in a lab template (would block console recovery) - DEVIATION D1
rhel9cis_set_boot_pass: false

# 5.1.7 SSH access restricted to the build/admin account.
# NOTE: the original pack used rhel9cis_sshd: {allow_users: ...}, which the
# role does not read - it would have been silently ignored (what-broke #1).
rhel9cis_sshd_allowusers: "rocky"
rhel9cis_sshd_allowgroups: ""

# 5.2.4 "users must provide password for escalation" - DEVIATION D2.
# rocky is a key-only automation/admin account with no password. With 5.2.4
# on, the role strips its NOPASSWD sudo (what-broke #2) AND its own pre-flight
# refuses to run as a passwordless build user (what-broke #9). Rule disabled;
# exclusion list kept as belt-and-braces.
rhel9cis_rule_5_2_4: false
rhel9cis_sudoers_exclude_nopasswd_list:
  - rocky

# Role refuses to run with its example authselect profile name (pre-flight).
rhel9cis_authselect_custom_profile_name: ch_mirror_cis

# 2.1.9 / 2.1.12 (CIS Rocky v1 2.2.16 / 2.2.17) - issue #1.
# Role defaults say the host NEEDS nfs/rpcbind (*_server: true), so in 1.0.0
# both rules were skipped and the cloud image's packages stayed. *_mask: false
# means remove the package rather than mask the unit.
rhel9cis_nfs_server: false
rhel9cis_nfs_mask: false
rhel9cis_rpc_server: false
rhel9cis_rpc_mask: false

# 6.1.2 (CIS Rocky v1 1.3.2) - issue #3. Run AIDE from a systemd timer, not
# cron. The role only enables aidecheck.service/.timer; EL9's aide package
# doesn't ship them, so playbook.yml installs the units first.
rhel9cis_aide_scan: timer

# 5.4.1.5 (CIS Rocky v1 5.6.1.4) - issue #4. Same as the role default, made
# explicit so the value is reviewed here.
rhel9cis_inactivelock:
  lock_days: 30

# 5.4.1.2 / 5.4.1.3 (CIS Rocky v1 5.6.1.2 / 5.6.1.3) - issue #6. Also apply
# min days / warn age to EXISTING accounts that have a usable password, not
# just new ones via login.defs. (Max days left alone: forcing it can expire a
# live account.)
rhel9cis_force_user_mindays: true
rhel9cis_force_user_warnage: true

rhel9cis_default_zone: public    # firewalld zone; public permits ssh
